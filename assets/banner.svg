<text x="600" y="206" text-anchor="middle" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="26" fill="#c9d1ff" opacity="0">Websites that make people stay<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.79;0.96;1" dur="16s" repeatCount="indefinite"/></text>
